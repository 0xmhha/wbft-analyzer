# Build, test and lint of wbft-analyzer.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
