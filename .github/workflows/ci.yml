# Build, test and lint of wbft-analyzer.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  spec:
    # The public requirement list (internal/privacy/data/requirements.txt)
    # must be that of the wbft-spec revision of spec.lock.
    name: public requirement list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - id: lock
        run: |
          echo "repository=$(sed -n 's/^repository=//p' spec.lock)" >> "$GITHUB_OUTPUT"
          echo "commit=$(sed -n 's/^commit=//p' spec.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.lock.outputs.repository }}
          ref: ${{ steps.lock.outputs.commit }}
          path: wbft-spec
      - run: go test -run TestRequirementsMatchSpec -v ./internal/privacy/
        env:
          WBFT_SPEC_DIR: ${{ github.workspace }}/wbft-spec
