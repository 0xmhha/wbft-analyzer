# Build, test and lint of wbft-analyzer.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    # The store's integration tests run on this PostgreSQL, each on a
    # schema of its own.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analyzer
          POSTGRES_PASSWORD: analyzer
          POSTGRES_DB: analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analyzer"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      WBFT_ANALYZER_TEST_DSN: postgres://analyzer:analyzer@localhost:5432/analyzer?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  dump:
    # Roadmap A0: a loaded database is kept as a pg_dump artifact, and the
    # dump restored on another server answers the API the same.
    name: dump and restore
    runs-on: ubuntu-latest
    services:
      source:
        image: postgres:16
        env:
          POSTGRES_USER: analyzer
          POSTGRES_PASSWORD: analyzer
          POSTGRES_DB: analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analyzer"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      target:
        image: postgres:16
        env:
          POSTGRES_USER: analyzer
          POSTGRES_PASSWORD: analyzer
          POSTGRES_DB: analyzer
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U analyzer"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum
      - name: PostgreSQL client 16
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pg_dump --version
      - run: >-
          scripts/dump-check.sh
          'postgres://analyzer:analyzer@localhost:5432/analyzer?sslmode=disable'
          'postgres://analyzer:analyzer@localhost:5433/analyzer?sslmode=disable'
          dump-check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-dump
          path: dump-check/
          if-no-files-found: ignore

  web:
    # The front end: its API types are those of api/openapi.json, it
    # type-checks, its tests pass, and it builds into the binary.
    name: web front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum
      - run: npm ci
      - name: API types match api/openapi.json
        run: |
          npm run gen
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm test
      - run: npm run build
      - name: The binary embeds the build
        working-directory: .
        run: go test -count=1 ./internal/web/
        env:
          WBFT_ANALYZER_WEB_BUILT: "1"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  spec:
    # The public requirement list (internal/privacy/data/requirements.txt)
    # must be that of the wbft-spec revision of spec.lock.
    name: public requirement list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - id: lock
        run: |
          echo "repository=$(sed -n 's/^repository=//p' spec.lock)" >> "$GITHUB_OUTPUT"
          echo "commit=$(sed -n 's/^commit=//p' spec.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.lock.outputs.repository }}
          ref: ${{ steps.lock.outputs.commit }}
          path: wbft-spec
      - run: go test -run TestRequirementsMatchSpec -v ./internal/privacy/
        env:
          WBFT_SPEC_DIR: ${{ github.workspace }}/wbft-spec
