# golangci-lint v2 configuration of the wbft-analyzer module.
version: "2"

run:
  tests: true

linters:
  default: standard
  enable:
    - misspell
    - unconvert

  exclusions:
    presets:
      - std-error-handling

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
